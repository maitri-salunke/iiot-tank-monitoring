; ESP32 vibration node: ADXL345 (I2C) -> RMS/FFT -> Modbus RTU slave on RS-485.
; Status: COMPILES with PlatformIO; NOT flashed or tested on hardware.
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -DVIB_FW_VERSION=0x0100
