apiVersion: 1
datasources:
  - name: InfluxDB
    uid: influx
    type: influxdb
    access: proxy
    url: $INFLUX_URL
    isDefault: true
    jsonData:
      version: Flux
      organization: $INFLUX_ORG
      defaultBucket: $INFLUX_BUCKET
      timeInterval: 500ms
    secureJsonData:
      token: $INFLUX_TOKEN
