# Mosquitto 2.x -- TLS-only, mutual TLS, identity = client certificate CN.
per_listener_settings false
persistence true
persistence_location /mosquitto/data/
autosave_interval 10
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
# Disable Nagle on client sockets: a QoS 1 PUBLISH forwarded to the ingestor is
# small and must not sit behind the peer's delayed ACK (latency budget, README).
set_tcp_nodelay true

listener 8883
protocol mqtt
cafile /certs/ca.crt
certfile /certs/mosquitto.crt
keyfile /certs/mosquitto.key
require_certificate true
use_identity_as_username true
tls_version tlsv1.2

acl_file /mosquitto/acl

# QoS 1 queues for the persistent ingestor session. Defaults (1000 msgs) would
# silently DROP messages during a large backfill -- set unlimited.
max_queued_messages 0
max_queued_bytes 0
max_inflight_messages 100
